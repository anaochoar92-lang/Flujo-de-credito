server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
    location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 35s; }
    location /docs { proxy_pass http://api:8000; proxy_set_header Host $host; }
    location /redoc { proxy_pass http://api:8000; proxy_set_header Host $host; }
    location /openapi.json { proxy_pass http://api:8000; proxy_set_header Host $host; }
    location / { try_files $uri $uri/ /index.html; }
}
